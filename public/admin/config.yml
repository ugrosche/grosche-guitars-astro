backend:
  name: github
  repo: ugrosche/grosche-guitars-astro
  branch: main

media_folder: /public/images
public_folder: /images

collections:

  # ============================================================
  # GITARREN
  # ============================================================

  - name: guitars
    label: Gitarren
    label_singular: Gitarre
    folder: src/content/guitars
    create: true
    slug: "{{slug}}"

    media_folder: "/src/assets/images/guitars/{{filename}}"
    public_folder: "/src/assets/images/guitars/{{filename}}"

    fields:

      - label: Titel
        name: title
        widget: string

      - label: Reihenfolge
        name: order
        widget: number
        value_type: int
        min: 1
        required: false
        hint: "Position auf der Gitarrenübersicht, z. B. 1, 2, 3 ..."

      - label: Baujahr
        name: year
        widget: number
        required: false

      - label: Titelbild
        name: hero
        widget: object
        fields:

          - label: Bild
            name: src
            widget: image

          - label: Bildbeschreibung
            name: alt
            widget: string
            required: false

          - label: Bildunterschrift
            name: description
            widget: string
            required: false

      - label: Beschreibung
        name: description
        widget: markdown
        required: false

      - label: Technische Daten
        name: specifications
        widget: list
        required: false

        fields:

          - label: Eigenschaft
            name: label
            widget: string

          - label: Wert
            name: value
            widget: string

      - label: Bauschritte
        name: build_steps
        widget: list
        required: false
        summary: "{{fields.title}}"

        fields:

          - label: Titel
            name: title
            widget: string

          - label: Beschreibung
            name: description
            widget: markdown
            required: false

          - label: Darstellung
            name: display
            widget: select
            default: gallery

            options:
              - label: Galerie
                value: gallery

              - label: Karussell
                value: carousel

              - label: Einzelbilder
                value: single

          - label: Bilder
            name: images
            widget: list
            required: false

            fields:

              - label: Bild
                name: src
                widget: image

              - label: Bildunterschrift
                name: caption
                widget: string
                required: false

              - label: Bildbeschreibung
                name: alt
                widget: string
                required: false

      - label: Abschlussgalerie
        name: gallery
        widget: list
        required: false

        fields:

          - label: Bild
            name: src
            widget: image

          - label: Bildunterschrift
            name: caption
            widget: string
            required: false

          - label: Bildbeschreibung
            name: alt
            widget: string
            required: false


  # ============================================================
  # WERKSTATT
  # ============================================================

  - name: workshop
    label: Werkstatt
    label_singular: Werkstattprojekt
    folder: src/content/workshop
    create: true
    slug: "{{slug}}"

    media_folder: "/src/assets/images/workshop/{{filename}}"
    public_folder: "/src/assets/images/workshop/{{filename}}"

    fields:

      # --------------------------------------------------------
      # Allgemeine Projektdaten
      # --------------------------------------------------------

      - label: Titel
        name: title
        widget: string
        hint: "Name des Werkstattprojekts, z. B. Binding-Fräsvorrichtung."
      - label: Reihenfolge
        name: order
        widget: number
        value_type: int
        min: 1
        required: false
        hint: "Position auf der Werkstattübersicht, z. B. 1, 2, 3 ..."

      - label: Kurzbeschreibung
        name: description
        widget: text
        required: false
        hint: "Kurzer Text für die Werkstattübersicht und die Einleitung der Detailseite."


      # --------------------------------------------------------
      # Titelbild
      # --------------------------------------------------------

      - label: Titelbild
        name: hero
        widget: object
        collapsed: false

        fields:

          - label: Bild
            name: src
            widget: image

          - label: Bildbeschreibung
            name: alt
            widget: string
            required: false
            hint: "Kurze Beschreibung des Bildinhalts für die Barrierefreiheit."

          - label: Bildunterschrift
            name: description
            widget: string
            required: false
            hint: "Optionaler Text unter dem Titelbild."


      # --------------------------------------------------------
      # Freier Einleitungstext
      # --------------------------------------------------------

      - label: Projektbeschreibung
        name: body
        widget: markdown
        required: false
        hint: "Hier kannst du Hintergrund, Idee, Problemstellung und Funktionsprinzip des Projekts beschreiben."


      # --------------------------------------------------------
      # Bauschritte
      # --------------------------------------------------------

      - label: Bauschritte
        label_singular: Bauschritt
        name: build_steps
        widget: list
        required: false
        collapsed: true
        summary: "{{fields.title}}"

        fields:

          - label: Titel
            name: title
            widget: string
            hint: "Zum Beispiel: Grundkonstruktion, Fräseinheit oder Im Einsatz."

          - label: Beschreibung
            name: description
            widget: markdown
            required: false
            hint: "Beschreibung dieses Arbeitsschritts."

          - label: Darstellung der Bilder
            name: display
            widget: select
            default: gallery
            hint: "Legt fest, wie die Bilder dieses Bauschritts dargestellt werden."

            options:
              - label: Galerie
                value: gallery

              - label: Karussell
                value: carousel

              - label: Einzelbilder
                value: single


          # ----------------------------------------------------
          # Bilder innerhalb des Bauschritts
          # ----------------------------------------------------

          - label: Bilder
            label_singular: Bild
            name: images
            widget: list
            required: false
            collapsed: true
            summary: "{{fields.caption}}"

            fields:

              - label: Bild
                name: src
                widget: image

              - label: Bildunterschrift
                name: caption
                widget: text
                required: false
                hint: "Optionaler sichtbarer Text unter dem Bild."

              - label: Bildbeschreibung
                name: alt
                widget: string
                required: false
                hint: "Kurze Beschreibung des Bildinhalts für die Barrierefreiheit."
