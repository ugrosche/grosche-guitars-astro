<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 590" role="img" aria-labelledby="title desc">
<title id="title">Grosche Guitars – Negativversion</title>
<desc id="desc">Elegantes Grosche-Gitarrenlogo mit organischem G, vier Saiten und gut lesbarem Schriftzug.</desc>
<g fill="none" stroke="#F4F0E8" stroke-linecap="round" stroke-linejoin="round">
  <!-- Organisch geformtes G: bewusst nahe an der freigegebenen Vorlage -->
  <path stroke-width="23" d="M438 92
    C376 94 337 119 331 157
    C326 181 342 197 352 211
    C363 226 354 246 335 261
    C308 283 304 309 319 333
    C337 362 379 379 438 382"/>
  <path stroke-width="23" d="M482 92 H590 V150"/>
  <path stroke-width="23" d="M482 229 H621
    C587 238 567 251 567 276
    V333
    C548 359 516 376 482 382"/>
</g>
<!-- Vier separat definierte, gleichmäßig gesetzte Saiten -->
<g fill="none" stroke="#F4F0E8" stroke-width="5.1" stroke-linecap="round">
  <path d="M447 48 V425"/>
  <path d="M462 48 V425"/>
  <path d="M477 48 V425"/>
  <path d="M492 48 V425"/>
</g>
<text x="450" y="500" text-anchor="middle" fill="#F4F0E8"
 font-family="Georgia, 'Times New Roman', serif" font-size="91"
 font-weight="normal" letter-spacing="13">GROSCHE</text>
<path d="M175 555 H330 M570 555 H725" stroke="#F4F0E8" stroke-width="2.7" fill="none"/>
<text x="450" y="568" text-anchor="middle" fill="#F4F0E8"
 font-family="Georgia, 'Times New Roman', serif" font-size="31"
 letter-spacing="15">GUITARS</text>
</svg>